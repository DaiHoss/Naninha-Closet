<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Textura de fundo: manchas suaves + trama de linho + granulado.
       Para deixar mais forte ou mais fraca, mude os valores de "opacity" de cada camada. -->
  <defs>
    <filter id="manchas" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.70  0 0 0 0 0.40  0 0 0 0 0.34  0 0 0 0.9 0"/>
    </filter>
    <filter id="granulado" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.22  0 0 0 0 0.20  0 0 0 1 0"/>
    </filter>
    <!-- trama de linho: fios finos na horizontal e na vertical -->
    <pattern id="linho" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1.2" fill="#8a5446"/>
      <rect width="1.2" height="6" fill="#8a5446" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="300" height="300" filter="url(#manchas)" opacity="0.16"/>
  <rect width="300" height="300" fill="url(#linho)" opacity="0.045"/>
  <rect width="300" height="300" filter="url(#granulado)" opacity="0.2"/>
</svg>
